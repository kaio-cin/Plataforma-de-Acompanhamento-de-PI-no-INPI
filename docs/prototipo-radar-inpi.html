<title>Radar INPI — protótipo navegável</title>

<style>
:root, [data-theme="light"] { --canvas: #f4f6fa;--surface: #ffffff;--surface-muted: #eef2f8;--line: #e2e7ef;--line-strong: #8592a8;--ink: #0e1a33;--ink-muted: #475670;--ink-subtle: #5f6c84;--navy: #0f2557;--navy-active: #21428a;--nav-ink: #b9c7e6;--nav-ink-active: #ffffff;--primary: #1d3f91;--primary-hover: #163274;--on-primary: #ffffff;--primary-soft: #e7edfb;--primary-ink: #1d3f91;--accent: #2b6cc4;--focus-ring: #2b6cc4;--critical: #b42332;--critical-soft: #fcebed;--warning: #8f4d0a;--warning-soft: #fcf1e2;--info: #0d6573;--info-soft: #e2f3f5;--success: #1b7340;--success-soft: #e5f3ea;--shadow-card: 0 1px 2px rgba(14,26,51,0.05), 0 2px 8px rgba(14,26,51,0.04);--shadow-raised: 0 8px 24px rgba(14,26,51,0.10), 0 2px 6px rgba(14,26,51,0.06); }
[data-theme="dark"] { --canvas: #0a1120;--surface: #111a2c;--surface-muted: #17223a;--line: #222d45;--line-strong: #5d6c8a;--ink: #e9eef7;--ink-muted: #aab7cd;--ink-subtle: #919fb8;--navy: #0f1d3d;--navy-active: #213a70;--nav-ink: #9fb0d4;--nav-ink-active: #ffffff;--primary: #8db0ff;--primary-hover: #a8c3ff;--on-primary: #0a1633;--primary-soft: #1b2d55;--primary-ink: #b4caff;--accent: #77a8f2;--focus-ring: #8db0ff;--critical: #ff8f93;--critical-soft: #3b161b;--warning: #f0b46e;--warning-soft: #33240f;--info: #6cc9d6;--info-soft: #0f2d33;--success: #79d39f;--success-soft: #11291c;--shadow-card: 0 1px 2px rgba(0,0,0,0.4);--shadow-raised: 0 8px 24px rgba(0,0,0,0.5); }
:root { --space-1: 4px;--space-2: 8px;--space-3: 12px;--space-4: 16px;--space-5: 20px;--space-6: 24px;--space-8: 32px;--space-10: 40px;--radius-sm: 8px;--radius-md: 12px;--radius-lg: 18px;--radius-xl: 24px;--radius-pill: 999px;--font-sans: "Manrope", "Segoe UI", system-ui, sans-serif;--font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace; }
.display { font-family: var(--font-sans); font-size: 36px; line-height: 42px; font-weight: 700; letter-spacing: -0.02em; }
.title { font-family: var(--font-sans); font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.015em; }
.heading { font-family: var(--font-sans); font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: -0.01em; }
.kpi { font-family: var(--font-sans); font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em; }
.eyebrow { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.1em; }
.body { font-family: var(--font-sans); font-size: 15px; line-height: 22px; font-weight: 500; }
.body-sm { font-family: var(--font-sans); font-size: 13px; line-height: 20px; font-weight: 500; }
.label { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 700; }
.caption { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 600; }
.process { font-family: var(--font-mono); font-size: 13px; line-height: 20px; font-weight: 500; }

<style>


/* Radar INPI — component styles. Every colour, space, radius and shadow is a token from tokens.json. */
body { margin: 0; font-family: var(--font-sans); background: var(--canvas); color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
*, *::before, *::after { box-sizing: border-box; }
.rp-pad { padding: var(--space-6); }
.rp-row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.rp-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.rp-mono, .process { font-family: var(--font-mono); font-feature-settings: "tnum" 1; }
.rp-muted { color: var(--ink-muted); }
.rp-subtle { color: var(--ink-subtle); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* Icon */
.rp-icon { display: inline-block; flex: none; vertical-align: middle; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* Button */
.rp-btn { font: inherit; font-size: 14px; font-weight: 700; line-height: 20px; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: 42px; padding: 0 var(--space-5); border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.rp-btn:hover { background: var(--surface-muted); }
.rp-btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.rp-btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.rp-btn-ghost { background: transparent; border-color: transparent; color: var(--primary-ink); }
.rp-btn-ghost:hover { background: var(--primary-soft); }
.rp-btn-danger { background: var(--surface); border-color: var(--line); color: var(--critical); }
.rp-btn-danger:hover { background: var(--critical-soft); }
.rp-btn-sm { height: 34px; padding: 0 var(--space-3); font-size: 13px; border-radius: var(--radius-sm); }
.rp-btn[disabled] { opacity: .5; cursor: not-allowed; }
.rp-iconbtn { position: relative; width: 42px; height: 42px; padding: 0; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.rp-iconbtn:hover { background: var(--surface-muted); color: var(--ink); }
.rp-iconbtn-dot { position: absolute; top: 8px; right: 9px; width: 9px; height: 9px; border-radius: var(--radius-pill); background: var(--critical); box-shadow: 0 0 0 2px var(--surface); }

/* Badge */
.rp-badge { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 12px; line-height: 16px; font-weight: 700; white-space: nowrap; background: var(--surface-muted); color: var(--ink-muted); }
.rp-badge-dot::before { content: ""; width: 7px; height: 7px; border-radius: var(--radius-pill); background: currentColor; }
.rp-badge-primary { background: var(--primary-soft); color: var(--primary-ink); }
.rp-badge-critical { background: var(--critical-soft); color: var(--critical); }
.rp-badge-warning { background: var(--warning-soft); color: var(--warning); }
.rp-badge-info { background: var(--info-soft); color: var(--info); }
.rp-badge-success { background: var(--success-soft); color: var(--success); }
.rp-code { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-muted); font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--ink); white-space: nowrap; }

/* Avatar */
.rp-avatar { display: inline-flex; align-items: center; justify-content: center; flex: none; border-radius: var(--radius-pill); background: var(--primary); color: var(--on-primary); font-weight: 700; letter-spacing: .02em; }

/* Card */
.rp-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); min-width: 0; }
.rp-card-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-6) 0; }
.rp-card-head h2 { margin: 0; flex: 1; color: var(--ink); }
.rp-card-body { padding: var(--space-5) var(--space-6) var(--space-6); }
.rp-card-flush { padding: var(--space-4) 0 var(--space-2); }

/* StatCard */
.rp-stat { padding: var(--space-5) var(--space-6) var(--space-6); display: flex; flex-direction: column; gap: var(--space-3); }
.rp-stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--ink-subtle); }
.rp-stat-value { margin: 0; color: var(--ink); }
.rp-stat-delta { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
.rp-stat-delta.is-critical { color: var(--critical); } .rp-stat-delta.is-success { color: var(--success); } .rp-stat-delta.is-warning { color: var(--warning); }

/* Fields */
.rp-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rp-field-label { color: var(--ink); }
.rp-field-label .req { color: var(--critical); margin-left: 2px; }
.rp-field-hint { font-size: 12px; line-height: 16px; color: var(--ink-subtle); }
.rp-field-error .rp-field-hint { color: var(--critical); }
.rp-input { display: flex; align-items: center; gap: var(--space-2); height: 44px; padding: 0 var(--space-4); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink-subtle); }
.rp-input:focus-within { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--primary-soft); }
.rp-field-error .rp-input { border-color: var(--critical); }
.rp-input input, .rp-input select, .rp-input textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: var(--ink); appearance: none; }
.rp-input input::placeholder, .rp-input textarea::placeholder { color: var(--ink-subtle); }
.rp-input-mono input { font-family: var(--font-mono); font-size: 13px; }
.rp-input-area { height: auto; padding: var(--space-3) var(--space-4); align-items: flex-start; }
.rp-input-area textarea { resize: none; min-height: 72px; line-height: 22px; }
.rp-search { width: 100%; max-width: 480px; height: 44px; border-color: var(--line); border-radius: var(--radius-md); background: var(--canvas); }
.rp-kbd { font-family: var(--font-mono); font-size: 11px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-subtle); background: var(--surface); }

/* Toggle */
.rp-toggle { display: inline-flex; align-items: center; gap: var(--space-3); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); }
.rp-toggle-track { position: relative; width: 40px; height: 24px; border-radius: var(--radius-pill); background: var(--line-strong); transition: background .15s; flex: none; }
.rp-toggle-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: var(--radius-pill); background: var(--surface); transition: transform .15s; }
.rp-toggle.is-on .rp-toggle-track { background: var(--primary); }
.rp-toggle.is-on .rp-toggle-track::after { transform: translateX(16px); }

/* Tabs */
.rp-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: var(--radius-md); background: var(--surface-muted); }
.rp-tab { font: inherit; font-size: 13px; font-weight: 700; height: 34px; padding: 0 var(--space-4); border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--ink-muted); cursor: pointer; display: inline-flex; align-items: center; gap: var(--space-2); }
.rp-tab.is-active { background: var(--surface); color: var(--primary-ink); box-shadow: var(--shadow-card); }
.rp-tab-count { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-pill); background: var(--line); color: var(--ink-muted); }
.rp-tab.is-active .rp-tab-count { background: var(--primary-soft); color: var(--primary-ink); }

/* Chips (filters) */
.rp-chip { font: inherit; font-size: 13px; font-weight: 600; height: 34px; padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--line); background: var(--surface); color: var(--ink-muted); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.rp-chip.is-on { background: var(--primary-soft); border-color: transparent; color: var(--primary-ink); }

/* Sidebar */
.rp-shell { display: grid; grid-template-columns: 264px 1fr; min-height: 100vh; background: var(--canvas); }
.rp-side { background: var(--navy); color: var(--nav-ink); display: flex; flex-direction: column; padding: var(--space-5) var(--space-4); gap: var(--space-2); }
.rp-brand { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-2) var(--space-5); }
.rp-brand-mark { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--nav-ink-active); color: var(--navy); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; letter-spacing: -.02em; }
.rp-brand-name { color: var(--nav-ink-active); font-weight: 800; font-size: 16px; line-height: 20px; letter-spacing: -.01em; }
.rp-brand-sub { color: var(--nav-ink); font-size: 12px; line-height: 16px; font-weight: 600; }
.rp-side-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--nav-ink); opacity: .85; padding: var(--space-4) var(--space-3) var(--space-1); }
.rp-nav { display: flex; align-items: center; gap: var(--space-3); height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--nav-ink); font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
.rp-nav:hover { background: var(--navy-active); color: var(--nav-ink-active); }
.rp-nav.is-active { background: var(--navy-active); color: var(--nav-ink-active); }
.rp-nav-count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: var(--radius-pill); background: var(--nav-ink-active); color: var(--navy); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; }
.rp-side-foot { margin-top: auto; padding: var(--space-4); border-radius: var(--radius-lg); background: var(--navy-active); color: var(--nav-ink); font-size: 12px; line-height: 18px; font-weight: 600; }
.rp-side-foot strong { display: block; color: var(--nav-ink-active); font-size: 13px; margin-bottom: 2px; }

/* Topbar */
.rp-main { display: flex; flex-direction: column; min-width: 0; }
.rp-top { display: flex; align-items: center; gap: var(--space-3); height: 76px; padding: 0 var(--space-10); background: var(--surface); border-bottom: 1px solid var(--line); }
.rp-top-spacer { flex: 1; }
.rp-user { display: flex; align-items: center; gap: var(--space-3); padding: 4px var(--space-3) 4px 4px; border: 1px solid var(--line); border-radius: var(--radius-pill); }
.rp-user-name { font-size: 14px; font-weight: 700; line-height: 18px; color: var(--ink); }
.rp-user-role { font-size: 12px; font-weight: 600; line-height: 16px; color: var(--ink-subtle); }
.rp-content { padding: var(--space-8) var(--space-10) var(--space-10); display: flex; flex-direction: column; gap: var(--space-6); }

/* PageHeader */
.rp-ph { display: flex; align-items: flex-end; gap: var(--space-5); }
.rp-ph-text { flex: 1; min-width: 0; }
.rp-ph-eyebrow { color: var(--primary-ink); text-transform: uppercase; margin: 0 0 var(--space-2); }
.rp-ph-title { margin: 0; color: var(--ink); }
.rp-ph-sub { margin: var(--space-2) 0 0; color: var(--ink-muted); }
.rp-ph-actions { display: flex; gap: var(--space-2); flex: none; }

/* AlertItem */
.rp-alert { display: grid; grid-template-columns: 40px 1fr auto; gap: var(--space-4); align-items: start; padding: var(--space-4) var(--space-6); border-top: 1px solid var(--line); }
.rp-alert:first-child { border-top: 0; }
.rp-alert.is-clickable, .rp-table tr.is-clickable { cursor: pointer; }
.rp-alert.is-clickable:hover { background: var(--surface-muted); }
.rp-alert.is-unread { background: color-mix(in srgb, var(--primary-soft) 45%, transparent); }
.rp-alert-icon { width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; background: var(--surface-muted); color: var(--ink-muted); }
.rp-alert-icon.t-critical { background: var(--critical-soft); color: var(--critical); }
.rp-alert-icon.t-warning { background: var(--warning-soft); color: var(--warning); }
.rp-alert-icon.t-info { background: var(--info-soft); color: var(--info); }
.rp-alert-icon.t-success { background: var(--success-soft); color: var(--success); }
.rp-alert-icon.t-primary { background: var(--primary-soft); color: var(--primary-ink); }
.rp-alert-title { margin: 0; color: var(--ink); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.rp-alert-meta { margin: 4px 0 0; color: var(--ink-muted); }
.rp-alert-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.rp-unread-dot { width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--primary); }

/* Timeline */
.rp-tl { list-style: none; margin: 0; padding: 0; position: relative; }
.rp-tl-item { position: relative; display: grid; grid-template-columns: 96px 28px 1fr; gap: 0 var(--space-3); padding-bottom: var(--space-6); }
.rp-tl-item:last-child { padding-bottom: 0; }
.rp-tl-date { text-align: right; padding-top: 2px; }
.rp-tl-date b { display: block; font-size: 13px; font-weight: 700; color: var(--ink); line-height: 18px; }
.rp-tl-date span { font-family: var(--font-mono); font-size: 12px; color: var(--ink-subtle); }
.rp-tl-rail { position: relative; display: flex; justify-content: center; }
.rp-tl-rail::after { content: ""; position: absolute; top: 24px; bottom: calc(-1 * var(--space-6)); width: 2px; background: var(--line); border-radius: 2px; }
.rp-tl-item:last-child .rp-tl-rail::after { display: none; }
.rp-tl-node { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: var(--radius-pill); background: var(--surface); border: 2px solid var(--line-strong); display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.rp-tl-node::after { content: ""; width: 8px; height: 8px; border-radius: var(--radius-pill); background: var(--line-strong); }
.rp-tl-node.t-critical { border-color: var(--critical); } .rp-tl-node.t-critical::after { background: var(--critical); }
.rp-tl-node.t-warning { border-color: var(--warning); } .rp-tl-node.t-warning::after { background: var(--warning); }
.rp-tl-node.t-info { border-color: var(--info); } .rp-tl-node.t-info::after { background: var(--info); }
.rp-tl-node.t-success { border-color: var(--success); } .rp-tl-node.t-success::after { background: var(--success); }
.rp-tl-node.t-primary { border-color: var(--primary); } .rp-tl-node.t-primary::after { background: var(--primary); }
.rp-tl-body { min-width: 0; }
.rp-tl-title { margin: 0; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; color: var(--ink); }
.rp-tl-desc { margin: 6px 0 0; color: var(--ink-muted); }
.rp-tl-deadline { margin-top: var(--space-3); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--warning-soft); color: var(--warning); font-size: 13px; font-weight: 600; }
.rp-tl-deadline.is-critical { background: var(--critical-soft); color: var(--critical); }
.rp-tl-deadline.is-done { background: var(--success-soft); color: var(--success); }

/* DataTable */
.rp-table-wrap { overflow-x: auto; }
.rp-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; line-height: 20px; }
.rp-table th { text-align: left; font-size: 12px; font-weight: 700; letter-spacing: .02em; color: var(--ink-muted); background: var(--surface-muted); padding: var(--space-3) var(--space-4); white-space: nowrap; }
.rp-table th:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); padding-left: var(--space-6); }
.rp-table th:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding-right: var(--space-6); }
.rp-table td { padding: var(--space-4); border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 500; vertical-align: middle; }
.rp-table td:first-child { padding-left: var(--space-6); }
.rp-table td:last-child { padding-right: var(--space-6); }
.rp-table tr:last-child td { border-bottom: 0; }
.rp-table tbody tr:hover td { background: var(--surface-muted); }
.rp-table .is-right { text-align: right; }
.rp-table .rp-mono, .rp-table .rp-badge { white-space: nowrap; }
.rp-cell-title { font-size: 14px; font-weight: 700; color: var(--ink); }
.rp-cell-sub { font-size: 12px; color: var(--ink-subtle); }
.rp-table-tight { margin: 0 var(--space-3); width: calc(100% - 2 * var(--space-3)); }

/* Calendar */
.rp-cal { display: flex; flex-direction: column; gap: var(--space-4); }
.rp-cal-head { display: flex; align-items: center; gap: var(--space-3); }
.rp-cal-head h3 { margin: 0; flex: 1; text-transform: capitalize; color: var(--ink); }
.rp-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.rp-cal-dow { font-size: 12px; font-weight: 700; color: var(--ink-subtle); text-align: left; padding: 0 var(--space-2) var(--space-1); text-transform: uppercase; letter-spacing: .06em; }
.rp-cal-day { min-height: 96px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
.rp-cal-day:hover { border-color: var(--line-strong); }
.rp-cal-day.is-out { background: var(--surface-muted); border-color: transparent; }
